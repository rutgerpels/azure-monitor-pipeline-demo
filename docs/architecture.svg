<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">Azure Monitor pipeline demo architecture</title>
  <desc id="description">One Azure-hosted Ubuntu VM simulates an on-premises site in West Europe. Python network-device simulators send Syslog and CEF through a private Traefik gateway into three Azure Monitor pipeline flows on K3s. Local parsing and optional filtering precede export. An NFS-backed RWX volume on the managed OS disk provides persistent buffering. A host firewall simulates loss of outbound connectivity. HTTPS ingestion through a data collection endpoint and pass-through data collection rule delivers records to a Sentinel-enabled Log Analytics workspace. Pipeline heartbeat, runtime metrics and diagnostic errors support the operations scene. The control plane uses PowerShell, Bicep, Azure Arc, a custom location, certificate management and the pipeline controller. This depicts code, not a running or end-to-end validated deployment.</desc>
  <defs>
    <linearGradient id="blue" x2="0" y2="1">
      <stop stop-color="#50b5fa"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="purple" x2="0" y2="1">
      <stop stop-color="#a67bf0"/>
      <stop offset="1" stop-color="#5c2d91"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#334155"/>
    </marker>
    <marker id="health-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0078d4"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #000000; }
      .title { font-size: 36px; font-weight: 650; }
      .heading { font-size: 25px; font-weight: 650; }
      .label { font-size: 21px; font-weight: 600; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .mono { font-family: Consolas, monospace; font-size: 17px; }
      .boundary { fill: none; stroke: #8c96a3; stroke-width: 2; stroke-dasharray: 12 6 2 6; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .health { fill: none; stroke: #0078d4; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#health-arrow); }
      .number { font-size: 18px; font-weight: 700; text-anchor: middle; }
    </style>
    <symbol id="vm" viewBox="0 0 64 64">
      <rect x="4" y="5" width="56" height="39" rx="3" fill="url(#blue)"/>
      <path d="M26 44h12v11H26zM18 56h28" fill="#aab4c0" stroke="#aab4c0" stroke-width="4"/>
      <path d="m32 14 12 7v14l-12 7-12-7V21Z" fill="#b3f3ff"/>
      <path d="m32 14 12 7-12 7-12-7Z" fill="#e2faff"/>
      <path d="M32 28v14l12-7V21Z" fill="#60d7f7"/>
    </symbol>
    <symbol id="network" viewBox="0 0 80 80">
      <g fill="url(#purple)">
        <rect x="7" y="6" width="66" height="18" rx="3"/>
        <rect x="7" y="31" width="66" height="18" rx="3"/>
        <rect x="7" y="56" width="66" height="18" rx="3"/>
      </g>
      <g fill="#e8dafb">
        <circle cx="61" cy="15" r="3"/><circle cx="61" cy="40" r="3"/><circle cx="61" cy="65" r="3"/>
        <path d="M16 12h24v6H16zM16 37h24v6H16zM16 62h24v6H16z"/>
      </g>
    </symbol>
    <symbol id="pipeline" viewBox="0 0 80 70">
      <path d="M19 52a16 16 0 0 1-1-32 23 23 0 0 1 44-2 17 17 0 0 1-1 34Z" fill="url(#blue)"/>
      <path d="M26 30h27v18H35V36h25M51 20l-8 8 8 8M52 42l8 8-8 8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="cluster" viewBox="0 0 66 56">
      <ellipse cx="33" cy="47" rx="30" ry="8" fill="#59d6f4"/>
      <g fill="url(#purple)" stroke="#ffffff" stroke-width="1.5">
        <path d="m18 5 11 5v13l-11 5-11-5V10Z"/>
        <path d="m46 5 11 5v13l-11 5-11-5V10Z"/>
        <path d="m32 24 11 5v13l-11 5-11-5V29Z"/>
      </g>
    </symbol>
    <symbol id="storage" viewBox="0 0 70 65">
      <path d="M8 14v38c0 13 54 13 54 0V14" fill="#cfe4fa" stroke="#0078d4" stroke-width="2"/>
      <ellipse cx="35" cy="14" rx="27" ry="10" fill="url(#blue)"/>
      <path d="M8 31c0 13 54 13 54 0M8 43c0 13 54 13 54 0" fill="none" stroke="#0078d4" stroke-width="2"/>
    </symbol>
    <symbol id="firewall" viewBox="0 0 70 66">
      <path d="M14 37a12 12 0 0 1 1-24 18 18 0 0 1 34-1 13 13 0 0 1 4 25Z" fill="url(#blue)"/>
      <rect x="12" y="30" width="48" height="30" rx="2" fill="#f7a2a5" stroke="#b4232b" stroke-width="2"/>
      <path d="M12 40h48M12 50h48M27 30v10M45 30v10M36 40v10M25 50v10M47 50v10" stroke="#b4232b" stroke-width="2"/>
    </symbol>
    <symbol id="logs" viewBox="0 0 70 66">
      <rect x="7" y="23" width="39" height="36" rx="2" fill="url(#blue)"/>
      <path d="M7 41h39M26 23v36" stroke="#ffffff" stroke-width="2"/>
      <circle cx="45" cy="24" r="20" fill="#29bdd8"/>
      <path d="M34 30V21M44 30V14M54 30V18" stroke="#ffffff" stroke-width="5"/>
    </symbol>
    <symbol id="shield" viewBox="0 0 60 64">
      <path d="M30 4c9 6 16 7 23 8v18c0 14-10 22-23 30C17 52 7 44 7 30V12c7-1 14-2 23-8Z" fill="url(#blue)"/>
      <path d="M18 32a12 12 0 0 1 24 0M24 33a6 6 0 0 1 12 0" fill="none" stroke="#d5f4ff" stroke-width="4"/>
    </symbol>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="40" y="57" class="title">Azure Monitor pipeline</text>
  <text x="40" y="91" class="body">Customer demo architecture / agentless collection, local processing and resilient delivery</text>
  <rect x="1284" y="29" width="276" height="42" rx="21" fill="#cfe4fa"/>
  <text x="1422" y="56" class="small" text-anchor="middle" font-weight="650">WEST EUROPE / SINGLE SITE</text>
  <rect x="40" y="116" width="1520" height="44" rx="8" fill="#fff4ce" stroke="#e8c96b"/>
  <text x="60" y="144" class="body">Code architecture, not a running deployment. End-to-end verification is pending; see README for the current blocker.</text>

  <rect x="40" y="190" width="960" height="655" rx="14" class="boundary"/>
  <use href="#vm" x="63" y="205" width="53" height="53"/>
  <text x="133" y="233" class="heading">Simulated on-premises site</text>
  <text x="64" y="272" class="body">One Azure-hosted Ubuntu VM / single K3s node / no public ingestion ports</text>

  <rect x="65" y="325" width="220" height="184" rx="9" class="card"/>
  <use href="#network" x="141" y="342" width="68" height="68"/>
  <text x="175" y="438" class="label" text-anchor="middle">Network devices</text>
  <text x="175" y="468" class="body" text-anchor="middle">Switch / firewall simulator</text>
  <text x="175" y="492" class="small" text-anchor="middle">Host-side Python; no agents</text>
  <text x="67" y="546" class="body" font-weight="600">Private TCP inputs</text>
  <text x="67" y="575" class="small">30514: baseline Syslog</text>
  <text x="67" y="599" class="small">30515: CEF / 30516: filtered Syslog</text>

  <rect x="345" y="307" width="610" height="300" rx="10" class="boundary"/>
  <use href="#cluster" x="365" y="317" width="42" height="36"/>
  <text x="420" y="343" class="label">Arc-enabled K3s cluster</text>
  <rect x="370" y="390" width="160" height="113" rx="8" fill="#f0f7ff" stroke="#90bfea"/>
  <path d="M397 413h105M397 425h105M397 437h105" stroke="#0078d4" stroke-width="4"/>
  <text x="450" y="469" class="label" text-anchor="middle">Traefik</text>
  <text x="450" y="492" class="small" text-anchor="middle">TCP gateway</text>

  <rect x="570" y="365" width="350" height="217" rx="9" class="card"/>
  <use href="#pipeline" x="586" y="376" width="64" height="56"/>
  <text x="657" y="400" class="label">Azure Monitor</text>
  <text x="657" y="426" class="label">pipeline</text>
  <circle cx="596" cy="453" r="12" fill="#cfe4fa"/><text x="596" y="459" class="number">1</text>
  <text x="619" y="459" class="body">Syslog / CEF schematization</text>
  <circle cx="596" cy="492" r="12" fill="#dff6dd"/><text x="596" y="498" class="number">2</text>
  <text x="619" y="498" class="body">Local KQL filter + reshape</text>
  <path d="M590 518h310" stroke="#dbe4ed"/>
  <text x="590" y="543" class="small">Three receivers, flows and exporters</text>
  <text x="590" y="566" class="small">Baseline / CEF / filtered Syslog</text>
  <path d="M285 445H370" class="flow"/>
  <text x="308" y="433" class="small">TCP</text>
  <path d="M530 445H570" class="flow"/>

  <rect x="65" y="650" width="260" height="135" rx="9" fill="#fff4ce" stroke="#e8c96b"/>
  <circle cx="89" cy="677" r="13" fill="#ffe2a5"/><text x="89" y="683" class="number">3</text>
  <text x="112" y="684" class="label">Outage + backfill</text>
  <text x="84" y="715" class="small">Block host and pod cloud egress</text>
  <text x="84" y="739" class="small">Continue sending locally</text>
  <text x="84" y="763" class="small">Auto-restore within 180 seconds</text>

  <rect x="570" y="660" width="350" height="125" rx="9" fill="#fff4ce" stroke="#e8c96b"/>
  <use href="#storage" x="587" y="677" width="59" height="55"/>
  <text x="662" y="694" class="label">Persistent buffer</text>
  <text x="662" y="721" class="body">NFS-backed RWX volume</text>
  <text x="591" y="757" class="small">Managed OS disk / shared by exporters</text>
  <path d="M745 583V660" class="flow" marker-start="url(#arrow)"/>
  <rect x="757" y="616" width="151" height="25" fill="#ffffff"/>
  <text x="766" y="634" class="small">Persist / recover</text>
  <text x="65" y="821" class="small">Local transformation drops noise and trims fields before telemetry leaves the simulated site.</text>

  <rect x="1090" y="190" width="470" height="655" rx="14" class="boundary"/>
  <use href="#logs" x="1110" y="207" width="55" height="51"/>
  <text x="1181" y="236" class="heading">Azure Monitor</text>
  <text x="1118" y="271" class="body">One workspace / standard + custom tables</text>
  <rect x="1120" y="385" width="400" height="103" rx="9" fill="#f0f7ff" stroke="#90bfea"/>
  <text x="1141" y="420" class="label">Data collection endpoint + rule</text>
  <text x="1141" y="450" class="body">DCE: HTTPS ingestion</text>
  <text x="1141" y="474" class="small">DCR: pass-through routing, no cloud filtering</text>
  <path d="M920 445H1120" class="flow"/>
  <rect x="994" y="395" width="80" height="80" fill="#ffffff"/>
  <use href="#firewall" x="999" y="408" width="70" height="66"/>
  <text x="1034" y="387" class="small" text-anchor="middle">HTTPS / 443</text>
  <text x="1034" y="502" class="small" text-anchor="middle">Fault boundary</text>

  <rect x="1120" y="535" width="400" height="167" rx="9" class="card"/>
  <use href="#logs" x="1135" y="548" width="49" height="46"/>
  <text x="1195" y="576" class="label">Log Analytics workspace</text>
  <text x="1144" y="617" class="mono">Syslog</text>
  <text x="1144" y="644" class="mono">CommonSecurityLog</text>
  <text x="1144" y="671" class="mono">NetworkDemoFiltered_CL</text>
  <path d="M1320 489V535" class="flow"/>

  <use href="#shield" x="1120" y="315" width="36" height="39"/>
  <text x="1170" y="332" class="body" font-weight="600">Microsoft Sentinel</text>
  <text x="1170" y="355" class="small">Minimal onboarding for CommonSecurityLog</text>

  <path d="M908 365V293H1540V617H1521" class="health"/>
  <rect x="1157" y="280" width="233" height="26" fill="#ffffff"/>
  <text x="1167" y="299" class="small">Health and diagnostic signals</text>
  <rect x="1120" y="732" width="400" height="86" rx="9" fill="#dff6dd" stroke="#a9cf9f"/>
  <circle cx="1145" cy="758" r="13" fill="#c4e9b9"/><text x="1145" y="764" class="number">4</text>
  <text x="1170" y="765" class="label">Operate the pipeline</text>
  <text x="1139" y="799" class="small">Heartbeat / CPU, memory, uptime / errors</text>
  <path d="M1320 703V732" class="flow"/>

  <rect x="40" y="880" width="1520" height="108" rx="12" class="boundary"/>
  <text x="65" y="910" class="label">Deployment and control plane</text>
  <text x="65" y="946" class="body">Presenter: PowerShell + Bicep + Azure CLI</text>
  <text x="65" y="973" class="small">VM management: HTTPS Run Command or restricted SSH</text>
  <path d="M509 946H587" class="health"/>
  <text x="611" y="943" class="label">Azure Arc + custom location</text>
  <text x="611" y="971" class="small">Cluster onboarding and resource placement</text>
  <path d="M945 946H1023" class="health"/>
  <text x="1047" y="943" class="label">Cluster extensions</text>
  <text x="1047" y="971" class="small">Certificate management + pipeline controller</text>

  <text x="40" y="1025" class="small">Solid arrows: telemetry and storage. Dashed blue arrows: health or management. Numbered badges: the four demo scenes.</text>
  <text x="40" y="1054" class="small">OTLP and preview throughput/buffer metrics are not deployed. The extension train is named Preview; see README for the GA/preview distinction.</text>
</svg>
