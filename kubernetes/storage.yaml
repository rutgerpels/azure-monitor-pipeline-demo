apiVersion: v1
kind: PersistentVolume
metadata:
  name: pipeline-buffer
spec:
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.80.0.4
    path: /var/lib/pipeline-buffer
